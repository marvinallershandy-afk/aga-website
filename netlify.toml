# ── SPA-Rewrites + echte 404 (v19-K, Audit A §2.13 / C §5) ─────
# Früher bog ein einziges /* → /index.html (200) ALLE unbekannten Pfade auf
# die Startkarte um — vertippte/geteilte Links zeigten kommentarlos die Karte
# (kein 404-Signal). Jetzt: Admin + alle Onepager-Deep-Link-Aliase (Quelle:
# src/map/places.ts aliases + Rundgang-Slugs) werden explizit auf den SPA-
# Einstieg index.html gerewritet (200, clientseitiges Routing via src/map/nav.ts),
# und NUR der Rest fällt auf die gebrandete 404-Seite (Status 404).
# Reihenfolge: erster Treffer gewinnt, der 404-Catch-all steht zuletzt.
# WICHTIG: Beim Erweitern der Aliase in places.ts diese Liste mitpflegen.

# Admin-Cockpit (eigene clientseitige Unterrouten /admin/statistik …)
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

