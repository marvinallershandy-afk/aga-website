# Deploy-Konfiguration (CI-tauglich, relative Pfade).
# release = öffentliche v13-Website + /admin-Cockpit in einem Build.
# Hinweis: .netlify/netlify.toml ist lokaler CLI-State (gitignored) und enthielt
# einen absoluten publish-Pfad — diese Datei hier ist die verbindliche Config.

[build]
  # P0 (Admin-Ausbau): scripts/prerender.mjs startet Playwright-Chromium beim
  # Build. Im Netlify-CI ist der Chromium-Cache leer → der erste Build würde am
  # fehlenden Browser scheitern (BUILD_LOG_aga §4). Deshalb wird Chromium (inkl.
  # System-Libs) VOR pnpm build im CI installiert. Bewusst NUR hier im
  # netlify.toml-Command, nicht in package.json — so bleibt der lokale
  # `pnpm build` unverändert (lokal liegt Chromium bereits im Cache) und der
  # 3D-Onepager-Prerender ist unberührt.
  command = "pnpm exec playwright install --with-deps chromium && pnpm build"
  publish = "dist"

# Rechtsseiten als eigenständige statische HTML-Dateien (public/).
# MÜSSEN vor dem SPA-Fallback stehen — Netlify wertet Redirects von oben nach
# unten aus, der erste Treffer gewinnt. Sonst bögen die /*-Regel die hübschen
# URLs (/impressum) auf den 3D-Onepager um.
# Grund für statische Seiten statt In-App-Route: Impressum/Datenschutz müssen
# ständig verfügbar sein (§ 5 DDG) — auch ohne WebGL und ohne JavaScript.
[[redirects]]
  from = "/impressum"
  to = "/impressum.html"
  status = 200

[[redirects]]
  from = "/datenschutz"
  to = "/datenschutz.html"
  status = 200

# v15-L: Live-Seite als eigene HTML-Datei (eigene OG-Meta, kein three.js).
[[redirects]]
  from = "/live"
  to = "/live.html"
  status = 200

[[redirects]]
  from = "/live/"
  to = "/live.html"
  status = 200

# v16-S: Partner-Seite als eigene HTML-Datei (eigene OG-Meta, kein three.js).
[[redirects]]
  from = "/partner"
  to = "/partner.html"
  status = 200

[[redirects]]
  from = "/partner/"
  to = "/partner.html"
  status = 200

# v17-A: Sammelalbum als eigene HTML-Datei (QR-Einstieg /album?c=…).
# Query-Strings bleiben bei 200-Rewrites erhalten.
[[redirects]]
  from = "/album"
  to = "/album.html"
  status = 200

[[redirects]]
  from = "/album/"
  to = "/album.html"
  status = 200

# v17-D: Galerien „Spieltag in Bildern“ als eigene HTML-Datei.
[[redirects]]
  from = "/galerie"
  to = "/galerie.html"
  status = 200

[[redirects]]
  from = "/galerie/"
  to = "/galerie.html"
  status = 200

# v18-A: Kalender-Abo → Supabase Edge Function `kalender` (Proxy, Adresse
# bleibt /kalender.ics → später https://aga-erste.de/kalender.ics).
# Query-Strings (?spiel=…, ?anstoss=…) reicht Netlify beim Proxy durch.
[[redirects]]
  from = "/kalender.ics"
  to = "https://fwiivwmoyagcdrjvhaou.supabase.co/functions/v1/kalender"
  status = 200
  force = true

[[redirects]]
  from = "/kalender-alle.ics"
  to = "https://fwiivwmoyagcdrjvhaou.supabase.co/functions/v1/kalender?alle=1"
  status = 200
  force = true

# v18-A: Kurz-Links für Instagram & Co. (Zuordnung in der Statistik, docs/STATISTIK.md).
# 302 statt 301: Ziele bleiben änderbar, Browser cachen nicht dauerhaft.
[[redirects]]
  from = "/ig"
  to = "/?utm_source=instagram&utm_medium=bio"
  status = 302
  force = true

[[redirects]]
  from = "/story"
  to = "/?utm_source=instagram&utm_medium=story"
  status = 302
  force = true

[[redirects]]
  from = "/qr"
  to = "/?utm_source=qr&utm_medium=platz"
  status = 302
  force = true

[[redirects]]
  from = "/wa"
  to = "/?utm_source=whatsapp"
  status = 302
  force = true

# SPA-Fallback: deckt sowohl den 3D-Onepager als auch /admin/* ab.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache-Kontrolle (v13-E10) ─────────────────────────────────
# Vite-Assets tragen Content-Hashes im Dateinamen → für immer cachebar.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Große, selten wechselnde Medien: lange cachen, aber revalidierbar
# (Dateinamen sind NICHT gehasht — bei Austausch greift der ETag).
# v15-L: live.html nie lange cachen (Bundle-Hashes wechseln mit jedem Deploy).
[[headers]]
  for = "/live.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/partner.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/album.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/galerie.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/galerie/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/training/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/draco/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/players/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/fans/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
