# ── Sicherheits-Header (v19-K, Audit C §5) ────────────────────
# Auf ALLE Antworten. Setzt KEIN Cache-Control → kein Konflikt mit den
# Cache-Regeln unten. three.js nutzt WASM (draco) + Blob-Worker, /live bindet den
# fussball.de-Widget-Iframe ein, Live/Statistik sprechen Supabase an.
# v25-C6: scharf geschaltet (Report-Only → CSP). Belegt in BUILD_LOG_V25.md:
# alle Routen (/, /live, /tippen, /album, /partner, /galerie, /admin-Login,
# Rechtsseiten) in Chromium + WebKit bei 390×844 und 1440×900 durchgeklickt —
# 0 echte Verstöße (nur WebKits report-only-Hinweis zu frame-ancestors, der beim
# Scharfschalten gerade entfällt). Prüf-Skript: _v25_csp.mjs (nicht committet).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://fwiivwmoyagcdrjvhaou.supabase.co; font-src 'self'; connect-src 'self' https://fwiivwmoyagcdrjvhaou.supabase.co; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' https://fwiivwmoyagcdrjvhaou.supabase.co; frame-src 'self' https://www.fussball.de https://www.fupa.net; form-action 'self'; manifest-src 'self'"

# ── Cache-Kontrolle (v13-E10 · v19-K Audit C §5) ──────────────
# HTML-Einstiege NIE lange cachen (Bundle-Hashes wechseln je Deploy — sonst
# hängen Besucher nach dem Veröffentlichen auf toten Asset-Hashes). Diese
# Regeln stehen VOR /galerie/* & Co.: Netlify nimmt die zuerst definierte
# passende Regel → /galerie (HTML) bekommt no-cache, /galerie/<bild> bleibt
# langlebig. Der frühere Bug: /galerie wurde von /galerie/* mit 7 Tagen erfasst.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/galerie"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/live"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/partner"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/album"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/tippen"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/teilnahmebedingungen"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/impressum"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/datenschutz"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite-Assets tragen Content-Hashes im Dateinamen → für immer cachebar.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Große, selten wechselnde Medien: lange cachen, aber revalidierbar
# (Dateinamen sind NICHT gehasht — bei Austausch greift der ETag).
# v15-L: live.html nie lange cachen (Bundle-Hashes wechseln mit jedem Deploy).
[[headers]]
  for = "/live.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
