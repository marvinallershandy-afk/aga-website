# ── Cache-Kontrolle (v13-E10) ─────────────────────────────────
# Vite-Assets tragen Content-Hashes im Dateinamen → für immer cachebar.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Große, selten wechselnde Medien: lange cachen, aber revalidierbar
# (Dateinamen sind NICHT gehasht — bei Austausch greift der ETag).
# v15-L: live.html nie lange cachen (Bundle-Hashes wechseln mit jedem Deploy).
[[headers]]
  for = "/live.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/partner.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/album.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/galerie.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/galerie/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/training/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
